<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bismillah Daily Streak 10</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>بسم الله الرحمن الرحيم</h1>
    <p class="subtitle">Bismillah Daily Streak — 10 Days</p>

    <div class="streak-dots" id="dots"></div>
    <p class="streak-count"><span id="current">0</span> / 10</p>

    <button id="checkinBtn" class="checkin">✓ Check in today</button>

    <div class="benefit-card" id="benefitCard">
      <p id="benefitText">Tap the button to begin your streak.</p>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
